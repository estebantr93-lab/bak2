# Ubuntu: /etc/nginx/sites-available/sgr (enlazado en sites-enabled). Amazon Linux: /etc/nginx/conf.d/sgr.conf
server {
    listen 80 default_server;
    # default_server atiende cualquier IP o DNS de la instancia; el nombre solo evita choques con el sitio de ejemplo.
    server_name sgr;

    # Evidencias de hasta 2 MB + el resto del formulario.
    client_max_body_size 3M;

    # Archivos estáticos reunidos con "python manage.py collectstatic".
    location /static/ {
        alias /srv/sgr/staticfiles/;
        expires 7d;
    }

    # Archivos subidos por los usuarios (evidencias). Con DEBUG=False Django no los sirve.
    location /media/ {
        alias /srv/sgr/media/;
        # Nunca ejecutar ni interpretar lo que suben los usuarios.
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://unix:/run/sgr/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
