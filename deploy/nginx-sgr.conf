# Ubuntu: /etc/nginx/sites-available/sgr (enlazado en sites-enabled). Amazon Linux: /etc/nginx/conf.d/sgr.conf
server {
    listen 80 default_server;
    # default_server atiende cualquier IP o DNS de la instancia; el nombre solo evita choques con el sitio de ejemplo.
    server_name sgr;

    # Evidencias de hasta 2 MB + el resto del formulario.
    client_max_body_size 3M;

    # Archivos estáticos reunidos con "python manage.py collectstatic".
    location /static/ {
        alias /srv/sgr/staticfiles/;
        expires 7d;
    }

    # Los archivos subidos (evidencias) NO se publican como carpeta: los entrega Django en /archivos/…
    # solo a quien tiene sesión, permiso y la delegación de esa evidencia. Rutas antiguas: no existen.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://unix:/run/sgr/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
