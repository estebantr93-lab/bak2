<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Gestión de Resultados — Ilustre Municipalidad de La Serena</title>
    <style>
        :root {
            --rojo: #AD0000;
            --vinotinto: #6D0101;
            --terracota: #B33D00;
            --texto: #241C18;
            --texto-suave: #6B5D54;
            --fondo: #FBF7F2;
            --borde: #E4D6C7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--fondo);
            color: var(--texto);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        header.barra {
            background: var(--rojo);
            color: #FFFFFF;
            padding: 1.1rem 1.5rem;
            border-bottom: 4px solid var(--vinotinto);
        }

        header.barra .contenedor {
            max-width: 1040px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        header.barra .marca {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: .02em;
        }

        header.barra .institucion {
            font-size: .82rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            opacity: .9;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .acceso {
            text-align: center;
            max-width: 46ch;
        }

        .acceso .etiqueta {
            display: inline-block;
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--terracota);
            border: 1px solid var(--borde);
            background: #FFFFFF;
            border-radius: 999px;
            padding: .25rem .8rem;
            margin-bottom: 1.2rem;
        }

        .acceso h1 {
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            line-height: 1.2;
            margin: 0 0 .8rem;
            color: var(--vinotinto);
        }

        .acceso p {
            color: var(--texto-suave);
            margin: 0 0 2rem;
        }

        .boton {
            display: inline-block;
            background: var(--rojo);
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            padding: .9rem 2.4rem;
            border-radius: 6px;
            border: 2px solid var(--rojo);
            transition: background .15s ease, border-color .15s ease;
        }

        .boton:hover { background: var(--vinotinto); border-color: var(--vinotinto); }
        .boton:focus-visible { outline: 3px solid var(--terracota); outline-offset: 3px; }

        footer.pie {
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            border-top: 1px solid var(--borde);
            color: var(--texto-suave);
            font-size: .82rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="barra">
        <div class="contenedor">
            <span class="marca">SGR · Sistema de Gestión de Resultados</span>
            <span class="institucion">Ilustre Municipalidad de La Serena</span>
        </div>
    </header>

    <main>
        <section class="acceso">
            <span class="etiqueta">Delegaciones municipales</span>
            <h1>Sistema de Gestión de Resultados</h1>
            <p>El acceso está restringido a funcionarios autorizados.</p>
            <a class="boton" href="/admin/">Ingresar al sistema</a>
        </section>
    </main>

    <footer class="pie">
        Proyecto académico para Back End.
    </footer>
</body>
</html>
